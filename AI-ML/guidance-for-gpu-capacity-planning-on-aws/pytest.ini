[pytest]
testpaths = tests
addopts = --cov=src --cov-report=term-missing -m "not integration and not llm_regression"
pythonpath = .
markers =
    integration: marks tests that require a deployed endpoint (deselect with '-m "not integration"')
    llm_regression: real Bedrock calls (~$0.10/run on Haiku 4.5); not run by default. Opt in via `make llm-regression` or RUN_LLM_REGRESSION=1 pytest -m llm_regression
