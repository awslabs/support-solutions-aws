[pytest]
# The Lambda modules (index.py, advisor.py, rules.py, ...) import each other by bare
# module name (e.g. `from rules import ...`), matching the Lambda runtime where the
# handler dir is on sys.path. conftest.py adds lambdas/widget to sys.path so tests
# can import them the same way.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    integration: end-to-end save->restore canary tests (may be skipped locally)
    unit: fast isolated unit tests with mocked AWS
